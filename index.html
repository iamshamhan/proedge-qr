<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PROEDGE - Experience the authentic. Premium sports shoes and accessories in Dehiwala, Sri Lanka.">
    <meta name="theme-color" content="#0096D6">
    <meta property="og:title" content="PROEDGE - Experience the Authentic">
    <meta property="og:description" content="Premium sports shoes and accessories in Dehiwala, Sri Lanka">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://iamshamhan.github.io/proedge-qr/">
    <meta property="og:image" content="https://iamshamhan.github.io/proedge-qr/logo-horizontal.svg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="PROEDGE - Experience the Authentic">
    <meta name="twitter:description" content="Premium sports shoes and accessories in Dehiwala, Sri Lanka">
    <title>PROEDGE - Experience the Authentic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="logo-stacked.svg">
    <link rel="apple-touch-icon" href="logo-stacked.svg">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <main class="page">
        <header class="header">
            <div class="logo-container">
                <img src="logo-stacked.svg" alt="PROEDGE Logo" class="logo" width="280" height="214">
            </div>
            <h1 class="brand-name">PROEDGE</h1>
            <p class="tagline">Experience the authentic.</p>
        </header>

        <section class="content">
            <p class="welcome-message">
                Welcome to PROEDGE, your destination for premium authentic sports shoes and accessories.
                Visit our store in Dehiwala, Sri Lanka or connect with us online.
            </p>

            <div class="location">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                    <circle cx="12" cy="10" r="3"/>
                </svg>
                <div class="location-text">
                    <span class="location-city">Dehiwala, Sri Lanka</span>
                    <span class="location-full">No. 123, Galle Road, Dehiwala 10350</span>
                </div>
            </div>

            <div class="links-grid" id="linksGrid">
                <!-- Links will be rendered from config.js -->
            </div>
        </section>

        <footer class="footer">
            <p class="copyright">&copy; 2026 PROEDGE. All rights reserved.</p>
        </footer>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
